<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
  <rect width="1120" height="560" rx="14" fill="#f8fafc"/>
  <text x="36" y="42" font-size="20" font-weight="800" fill="#0f172a">QuickSpaces — Production AWS CloudFront + Multi-Modal Space RAG + Governance Architecture</text>
  <text x="36" y="65" font-size="13" fill="#475569">Built for Amazon Quick (Quick Core Experience · Quick Spaces · AWS Quick Multi-Modal RAG · Enterprise Governance)</text>

  <!-- Client Box -->
  <rect x="34" y="165" width="165" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="116" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Enterprise User</text>
  <text x="116" y="228" text-anchor="middle" font-size="11.5" fill="#475569">• VP Admin (Full)</text>
  <text x="116" y="248" text-anchor="middle" font-size="11.5" fill="#475569">• RevOps Analyst (NA)</text>
  <text x="116" y="268" text-anchor="middle" font-size="11.5" fill="#475569">• External Contractor</text>
  <rect x="52" y="292" width="130" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="117" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Single HTTPS Origin</text>
  <text x="117" y="334" text-anchor="middle" font-size="10.5" fill="#1e40af">dxxxx.cloudfront.net</text>

  <!-- CloudFront Edge Box -->
  <rect x="242" y="125" width="215" height="295" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="349" y="158" text-anchor="middle" font-size="15" font-weight="800" fill="#312e81">Amazon CloudFront CDN</text>
  <text x="349" y="177" text-anchor="middle" font-size="11" fill="#4338ca">Global Edge TLS · Brotli · Zero CORS</text>

  <rect x="260" y="198" width="180" height="86" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="350" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">Behavior 1: Default (*)</text>
  <text x="350" y="242" text-anchor="middle" font-size="11" fill="#475569">Static SPA (HTML/CSS/JS)</text>
  <text x="350" y="260" text-anchor="middle" font-size="10.5" fill="#059669" font-weight="600">Origin Access Control (OAC)</text>

  <rect x="260" y="304" width="180" height="92" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="350" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">Behavior 2: /api/*</text>
  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#475569">Dynamic Space &amp; AI API</text>
  <text x="350" y="366" text-anchor="middle" font-size="10.5" fill="#dc2626" font-weight="600">CachingDisabled · Forward Query</text>

  <!-- S3 Private Bucket -->
  <rect x="510" y="95" width="250" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="635" y="126" text-anchor="middle" font-size="14" font-weight="800" fill="#065f46">Amazon S3 (Private Bucket)</text>
  <text x="635" y="147" text-anchor="middle" font-size="11.5" fill="#047857">QuickSpaces Web Workspace Assets</text>
  <text x="635" y="167" text-anchor="middle" font-size="11" fill="#065f46">• BlockPublicAccess = TRUE</text>
  <text x="635" y="185" text-anchor="middle" font-size="11" fill="#065f46">• Signed SigV4 via CloudFront OAC</text>

  <!-- QuickSpaces Core Service -->
  <rect x="510" y="230" width="285" height="275" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="652" y="260" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">QuickSpaces Core Engine (us-west-2)</text>

  <rect x="528" y="276" width="250" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="653" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">1. Multi-Modal Ingestion Pipeline</text>
  <text x="653" y="316" text-anchor="middle" font-size="10.8" fill="#334155">CSV Schema+PII · VTT [MM:SS] · BI KPIs · RFCs</text>

  <rect x="528" y="346" width="250" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="653" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">2. Zero-Leakage ACL + Hybrid RRF</text>
  <text x="653" y="385" text-anchor="middle" font-size="10.8" fill="#334155">Pre-Filter Clearance/Region -&gt; BM25 + Cosine</text>
  <text x="653" y="400" text-anchor="middle" font-size="10.5" fill="#b91c1c" font-weight="600">Dynamic PII Column Masking</text>

  <rect x="528" y="420" width="250" height="66" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="653" y="441" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">3. Governance Onboarding Agent</text>
  <text x="653" y="459" text-anchor="middle" font-size="10.8" fill="#334155">5 Controls · Readiness Score · 1-Click Fix</text>
  <text x="653" y="474" text-anchor="middle" font-size="10.5" fill="#b45309">SHA-256 Hash-Chained Audit Receipt</text>

  <!-- Right AWS AI & Data Tier -->
  <rect x="845" y="195" width="240" height="135" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="965" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#5b21b6">Amazon Bedrock</text>
  <text x="965" y="246" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">us.amazon.nova-lite-v1:0</text>
  <text x="965" y="268" text-anchor="middle" font-size="11" fill="#4c1d95">• Cross-Modal Synthesis [C1..C5]</text>
  <text x="965" y="287" text-anchor="middle" font-size="11" fill="#4c1d95">• Span &amp; Numeric Verifier</text>
  <text x="965" y="306" text-anchor="middle" font-size="11" fill="#4c1d95">• Auto BI Chart Spec Builder</text>

  <rect x="845" y="355" width="240" height="125" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="965" y="385" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Spaces Metadata &amp; KMS</text>
  <text x="965" y="407" text-anchor="middle" font-size="11" fill="#334155">• Space Catalog &amp; Favorites</text>
  <text x="965" y="426" text-anchor="middle" font-size="11" fill="#334155">• eu-central-1 CMK Residency Pin</text>
  <text x="965" y="445" text-anchor="middle" font-size="11" fill="#334155">• SHA-256 Governance Audit Log</text>

  <!-- Connectors -->
  <line x1="199" y1="270" x2="242" y2="270" stroke="#475569" stroke-width="2.5"/>
  <line x1="440" y1="240" x2="510" y2="150" stroke="#10b981" stroke-width="2.5"/>
  <line x1="440" y1="350" x2="510" y2="350" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="795" y1="315" x2="845" y2="265" stroke="#8b5cf6" stroke-width="2.5"/>
  <line x1="795" y1="420" x2="845" y2="420" stroke="#64748b" stroke-width="2.5"/>
</svg>
